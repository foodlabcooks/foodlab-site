<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Lab · Port Townsend</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><div class="overlay"><h1>{{hero_title}}</h1><p>{{tagline}}</p></div></header>
<main>
  <section class="intro"><h2>{{intro_heading}}</h2><p>{{intro_text}}</p></section>
  <section class="gallery">{{gallery}}
  </section>
  <section class="classes"><h2>{{classes_heading}}</h2>
    <div class="classes-tickets"><p>{{classes_tickets_note}}</p><a class="tickets" href="{{classes_tickets_url}}">{{classes_tickets_text}}</a></div>
    {{classes}}
  </section>
  <!-- Add more sections here when ready -->
</main>
<footer><p>Food Lab &middot; Port Townsend, WA</p><p><a class="contact" href="mailto:{{contact_email}}">Contact: {{contact_email}}</a></p><p class="credit">Photos from Unsplash</p></footer>
</body></html>
