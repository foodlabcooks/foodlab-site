backend:
  name: github
  repo: foodlabcooks/foodlab-site
  branch: main
  base_url: https://api.netlify.com
  site_domain: foodlab-porttownsend.netlify.app
media_folder: img
public_folder: /img
collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: content/home.json
        fields:
          - {label: "Big title", name: hero_title, widget: string}
          - {label: "Tagline under title", name: tagline, widget: string}
          - {label: "Intro heading", name: intro_heading, widget: string}
          - {label: "Intro text", name: intro_text, widget: text}
          - label: "Photo gallery"
            name: gallery
            widget: list
            fields:
              - {label: Photo, name: image, widget: image}
              - {label: "Photo description (for screen readers)", name: alt, widget: string}
              - {label: Caption, name: caption, widget: string}
          - {label: "Cooking classes heading", name: classes_heading, widget: string}
          - label: "Cooking classes"
            name: classes
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: "Link URL", name: link_url, widget: string}
              - {label: "Link text", name: link_text, widget: string}
          - {label: "Tickets note", name: classes_tickets_note, widget: string}
          - {label: "Tickets URL", name: classes_tickets_url, widget: string}
          - {label: "Tickets link text", name: classes_tickets_text, widget: string}
          - {label: "Contact email", name: contact_email, widget: string}
